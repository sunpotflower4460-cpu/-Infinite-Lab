name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true
      # Without WebGL Pixi falls back to Canvas 2D: the app must switch to the Graphics layer.
      - run: npx playwright test --project=chromium-no-webgl
        env:
          CI: true
          PW_NO_WEBGL: 1

  # Same E2E suite on the other engines: the pinned geometry SHA-256 must match on
  # SpiderMonkey (Firefox) and JavaScriptCore (WebKit / Safari) too.
  cross-engine:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.browser }}
        env:
          CI: true
          PW_ALL_BROWSERS: 1
